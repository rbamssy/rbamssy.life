<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rbamssy</title>
  <link rel="stylesheet" href="style.css?=v02">
</head>
<body>

  <div class="text">Maybe I should just accept that I'm a horrible person instead of trying to please everyone. I'm so tired of all of this.</div>

  <script>
    const textEl = document.querySelector('.text');

    function jitterText() {
      const isBigSpike = Math.random() < 0.14;
      const range = isBigSpike ? 1.8 : 0.7;

      const x = (Math.random() * (range * 2) - range).toFixed(2);
      const y = (Math.random() * (range * 2) - range).toFixed(2);

      textEl.style.transform = `translate(${x}px, ${y}px)`;

      const nextInterval = Math.random() * 16 + 4;
      setTimeout(jitterText, nextInterval);
    }
    jitterText();
  </script>

</body>
</html>
